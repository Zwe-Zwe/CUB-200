# Ablation: Config B without CutMix. Comparing A, B_no_cutmix and B separates the effect of the
# higher resolution from the effect of CutMix.
name: B_no_cutmix
description: Progressive resizing 224 -> 448 px, no CutMix (ablation)
cutmix_prob: 0.0
label_smoothing: 0.1
weight_decay: 0.05
dropout: 0.3
drop_path: 0.1
patience: 6
phases:
  - {img_size: 224, batch_size: 32, epochs: 15, lr_backbone: 1.0e-4, lr_head: 1.0e-3, warmup_epochs: 1}
  - {img_size: 448, batch_size: 16, epochs: 5, lr_backbone: 2.0e-5, lr_head: 2.0e-4, warmup_epochs: 0}
