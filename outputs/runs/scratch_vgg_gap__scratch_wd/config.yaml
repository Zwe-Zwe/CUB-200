model: scratch_vgg_gap
name: scratch_wd
phases:
- img_size: 224
  batch_size: 32
  epochs: 150
  lr_backbone: 0.01
  lr_head: 0.01
  warmup_epochs: 2
description: S4 + weight decay 5e-4 (warm-up + cosine LR, up to 150 epochs, early
  stopping patience 20)
cutmix_prob: 0.0
label_smoothing: 0.0
weight_decay: 0.0005
dropout: 0.0
drop_path: 0.0
patience: 20
optimizer: sgd
momentum: 0.9
lr_schedule: cosine
augment: basic
