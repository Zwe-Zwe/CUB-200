model: resnet50.tv2_in1k
full_train: false
name: tl_L6_hires_strongaug
phases:
- img_size: 224
  batch_size: 32
  epochs: 30
  lr_backbone: 0.0001
  lr_head: 0.001
  warmup_epochs: 1
- img_size: 448
  batch_size: 16
  epochs: 10
  lr_backbone: 2.0e-05
  lr_head: 0.0002
  warmup_epochs: 0
description: 'L6 resolution for ResNet-50: L5 (strong aug) with 30 epochs at 224 px
  + 10 epochs at 448 px'
cutmix_prob: 0.0
label_smoothing: 0.1
weight_decay: 0.05
dropout: 0.3
drop_path: 0.1
patience: 10
optimizer: adamw
momentum: 0.9
lr_schedule: cosine
augment: strong
freeze_backbone: false
