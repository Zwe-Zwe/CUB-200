model: resnet50.tv2_in1k
full_train: false
name: tl_L8_sgd_1e-3
phases:
- img_size: 224
  batch_size: 32
  epochs: 30
  lr_backbone: 0.001
  lr_head: 0.01
  warmup_epochs: 1
- img_size: 448
  batch_size: 16
  epochs: 10
  lr_backbone: 0.0002
  lr_head: 0.002
  warmup_epochs: 0
description: 'L8 ResNet-50: L6 with SGD momentum 0.9, wd 1e-4, backbone LR 0.001 /
  head 0.01'
cutmix_prob: 0.0
label_smoothing: 0.1
weight_decay: 0.0001
dropout: 0.3
drop_path: 0.1
patience: 10
optimizer: sgd
momentum: 0.9
lr_schedule: cosine
augment: strong
freeze_backbone: false
layer_decay: 1.0
