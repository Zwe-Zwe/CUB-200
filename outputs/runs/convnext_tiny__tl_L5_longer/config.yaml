model: convnext_tiny
full_train: false
name: tl_L5_longer
phases:
- img_size: 224
  batch_size: 32
  epochs: 40
  lr_backbone: 0.0001
  lr_head: 0.001
  warmup_epochs: 1
description: 'L5 longer training for ConvNeXt-Tiny: L3 (basic aug) with 40 epochs,
  patience 10'
cutmix_prob: 0.0
label_smoothing: 0.1
weight_decay: 0.05
dropout: 0.3
drop_path: 0.1
patience: 10
optimizer: adamw
momentum: 0.9
lr_schedule: cosine
augment: basic
freeze_backbone: false
