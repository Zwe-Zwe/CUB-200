model: convnext_tiny
full_train: false
name: tl_L2_discriminative
phases:
- img_size: 224
  batch_size: 32
  epochs: 20
  lr_backbone: 0.0001
  lr_head: 0.001
  warmup_epochs: 1
description: 'L2 LR policy: backbone 1e-4 / head 1e-3 + 1-epoch warm-up + cosine (AdamW,
  20 epochs)'
cutmix_prob: 0.0
label_smoothing: 0.0
weight_decay: 0.01
dropout: 0.0
drop_path: 0.0
patience: 6
optimizer: adamw
momentum: 0.9
lr_schedule: cosine
augment: basic
freeze_backbone: false
