[project]
name = "cub200-bird-classifier"
version = "1.0.0"
description = "Fine-grained bird species classification on CUB-200: from-scratch CNNs and a step-by-step transfer-learning ladder (ResNet-50 vs ConvNeXt-Tiny)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.30.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "onnx>=1.23",
    "onnxruntime>=1.31",
    "onnxscript>=0.7",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "streamlit>=1.66",
    "timm>=1.0",
    "torch>=2.4",
    "torchvision>=0.19",
]

[tool.uv]
package = false          # a project of scripts (python -m birdcls.*), not an installable package
