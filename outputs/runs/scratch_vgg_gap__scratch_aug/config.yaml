model: scratch_vgg_gap
name: scratch_aug
phases:
- img_size: 224
  batch_size: 32
  epochs: 50
  lr_backbone: 0.01
  lr_head: 0.01
  warmup_epochs: 0
description: S1 + basic data augmentation (crop, flip, rotation, colour jitter, random
  erasing)
cutmix_prob: 0.0
label_smoothing: 0.0
weight_decay: 0.0
dropout: 0.0
drop_path: 0.0
patience: 1000
optimizer: sgd
momentum: 0.9
lr_schedule: constant
augment: basic
